; Copy this file to config.ini and fill in your values.
; config.ini contains secrets (SMTP password, Zotero API key) -- do NOT commit it
; or put it anywhere publicly accessible.

[google_sheet]
; The long ID in your sheet's URL:
; https://docs.google.com/spreadsheets/d/THIS_PART_HERE/edit
sheet_id = 16p2NxOjshx8th3m2KRZkrV17mXqhBes4qlN4eqfigyw

; Each tab has its own "gid" number, visible in the URL when that tab is
; selected, e.g. .../edit#gid=123456789
authors_gid = 0
keywords_gid = 123456789
blackout_gid = 987654321

[arxiv]
; comma-separated list of arXiv category prefixes to restrict to
categories = astro-ph

[email]
; Gmail SMTP settings. Requires 2-Step Verification to be on for your Google
; account, and an App Password (NOT your normal Gmail password) -- see
; README for how to generate one.
smtp_host = smtp.gmail.com
smtp_port = 587
use_tls = true
use_ssl = false
smtp_user = you@gmail.com
smtp_password = your_16_char_app_password
from_addr = you@gmail.com
; comma-separated if you want more than one recipient
to_addr = you@gmail.com

[zotero]
; Personal library: your numeric User ID from https://www.zotero.org/settings/keys
library_id = 1234567
library_type = user
; API key with read/write access, created at https://www.zotero.org/settings/keys
api_key = your_zotero_api_key
; optional: restrict added items to one collection. Leave blank to add to
; your top-level library. Find the collection key from the collection's URL
; or via the Zotero API.
collection_key =

[state]
state_file = state.json
